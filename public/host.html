<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuizPit — Host</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">
    <span class="mark">Q</span> QuizPit
  </a>
  <a class="btn btn-secondary" href="/admin/dashboard.html">Dashboard</a>
</div>

<main class="page">
  <div class="container-wide stack">

    <!-- SCREEN 1: pick a quiz to host -->
    <section id="screen-pick" class="card stack">
      <h1>Host a game</h1>
      <p>Pick a quiz to launch. Players will join with a code once the lobby opens.</p>
      <div id="pick-list" class="stack"></div>
      <p id="pick-empty" class="muted hidden">You don't have any quizzes yet. <a href="/admin/editor.html">Create one</a>.</p>
      <p id="pick-error" class="error-text"></p>
    </section>

    <!-- SCREEN 2: lobby (big PIN + joined teams) -->
    <section id="screen-lobby" class="card stack hidden center">
      <p class="muted">Players join at <strong id="lobby-host-url"></strong> and enter this code</p>
      <div id="lobby-pin" class="pin-display lg"></div>
      <h2 id="lobby-quiz-title" style="margin-top:8px;"></h2>
      <div class="stack" style="text-align:left; width:100%;">
        <p class="muted" style="font-size:0.9rem;">Teams joined (<span id="lobby-count">0</span>)</p>
        <div id="lobby-teams" class="row" style="flex-wrap:wrap; gap:8px; min-height: 40px;"></div>
      </div>
      <button id="btn-start" class="btn btn-primary btn-lg btn-block" disabled>Start game</button>
    </section>

    <!-- SCREEN 3: live question -->
    <section id="screen-question" class="card stack hidden">
      <div class="row between">
        <span class="badge" id="question-progress">Q1</span>
        <span class="badge live" id="answer-count-badge">0 / 0 answered</span>
      </div>
      <h2 id="question-text" style="font-size:1.8rem;"></h2>
      <div id="answer-grid" class="answer-grid"></div>
    </section>

    <!-- SCREEN 4: question results -->
    <section id="screen-result" class="card stack hidden">
      <h2>Results</h2>
      <div id="result-bars" class="stack"></div>
      <hr class="divider" />
      <h3>Leaderboard</h3>
      <div id="result-leaderboard" class="leaderboard"></div>
      <button id="btn-next" class="btn btn-primary btn-lg btn-block">Next question</button>
    </section>

    <!-- SCREEN 5: final leaderboard -->
    <section id="screen-final" class="card stack hidden center">
      <h2>🏆 Final leaderboard</h2>
      <div id="final-leaderboard" class="leaderboard"></div>
      <button id="btn-new-game" class="btn btn-secondary btn-block">Host another game</button>
    </section>

  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script src="/js/host.js"></script>
</body>
</html>
